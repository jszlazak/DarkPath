<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DarkPath</title>
  <style>
    :root {
      --bg: #ffffff;
      --popup-bg: rgba(255, 255, 255, 0.96);
      --popup-border: rgba(0, 0, 0, 0.18);
      --popup-text: #111111;
      --button-bg: #101010;
      --button-text: #ffffff;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
    }

    body {
      font-family: "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;
    }

    #scene {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    #scene:active { cursor: grabbing; }

    #popup {
      position: fixed;
      z-index: 20;
      width: min(300px, 80vw);
      border: 1px solid var(--popup-border);
      border-radius: 12px;
      background: var(--popup-bg);
      color: var(--popup-text);
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.16);
      padding: 12px;
      display: none;
    }

    #popup-title {
      margin: 0 0 8px;
      font-size: 0.95rem;
      font-weight: 650;
      letter-spacing: 0.01em;
    }

    #popup-distance {
      margin: 0 0 10px;
      font-size: 0.86rem;
      opacity: 0.82;
    }

    #waitlist {
      width: 100%;
      min-height: 36px;
      border: 0;
      border-radius: 9px;
      background: var(--button-bg);
      color: var(--button-text);
      font-size: 0.83rem;
      letter-spacing: 0.02em;
      cursor: pointer;
    }

    #waitlist:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>

  <aside id="popup" aria-hidden="true">
    <p id="popup-title"></p>
    <p id="popup-distance"></p>
    <button id="waitlist" type="button">Join the waitlist</button>
  </aside>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js";
    import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/controls/OrbitControls.js";

    const canvas = document.getElementById("scene");
    const popup = document.getElementById("popup");
    const popupTitle = document.getElementById("popup-title");
    const popupDistance = document.getElementById("popup-distance");
    const waitlistButton = document.getElementById("waitlist");

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0xffffff, 0);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 0.3, 6.7);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.enablePan = false;
    controls.minDistance = 2.1;
    controls.maxDistance = 9;
    controls.rotateSpeed = 0.8;
    controls.zoomSpeed = 1.1;

    const globeRoot = new THREE.Group();
    scene.add(globeRoot);

    const globeRadius = 2.05;

    scene.add(new THREE.HemisphereLight(0xffffff, 0x888888, 1.0));

    const key = new THREE.DirectionalLight(0xffffff, 1.3);
    key.position.set(4.3, 2.4, 5.3);
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xffffff, 0.55);
    fill.position.set(-3.9, -1.8, -4.0);
    scene.add(fill);

    const AFRICA_POLY = [
      [-17, 32], [-8, 35], [2, 37], [12, 33], [25, 32], [34, 31], [35, 23],
      [43, 12], [51, 11], [50, 2], [43, -11], [40, -20], [33, -27], [30, -34],
      [20, -35], [13, -29], [10, -18], [4, -8], [-5, 4], [-13, 9], [-17, 18]
    ];

    const MADAGASCAR_POLY = [[48, -13], [51, -18], [49, -25], [45, -26], [43, -21], [45, -15]];

    const ROUTES = [
      { id: "route-1", title: "Sahara Traverse", distanceKm: 1140, start: { lat: 32.89, lon: 13.19 }, end: { lat: 19.61, lon: 37.22 }, color: 0x2ad0ff },
      { id: "route-2", title: "Great Rift Southbound", distanceKm: 890, start: { lat: -1.29, lon: 36.82 }, end: { lat: -11.67, lon: 43.27 }, color: 0x6be2ff },
      { id: "route-3", title: "Atlantic to Sahel", distanceKm: 960, start: { lat: 5.56, lon: -0.2 }, end: { lat: 15.5, lon: 32.56 }, color: 0x1ec7ff }
    ];

    function llToVec(lat, lon, radius) {
      const phi = THREE.MathUtils.degToRad(90 - lat);
      const theta = THREE.MathUtils.degToRad(lon + 180);
      return new THREE.Vector3(
        -radius * Math.sin(phi) * Math.cos(theta),
        radius * Math.cos(phi),
        radius * Math.sin(phi) * Math.sin(theta)
      );
    }

    function lonLatToCanvas(lon, lat, w, h) {
      return { x: ((lon + 180) / 360) * w, y: ((90 - lat) / 180) * h };
    }

    function drawPolygon(ctx, points, w, h, fillStyle) {
      ctx.beginPath();
      points.forEach(([lon, lat], i) => {
        const p = lonLatToCanvas(lon, lat, w, h);
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      });
      ctx.closePath();
      ctx.fillStyle = fillStyle;
      ctx.fill();
    }

    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = url;
      });
    }

    async function buildGlobe() {
      const w = 4096;
      const h = 2048;

      const baseCanvas = document.createElement("canvas");
      baseCanvas.width = w;
      baseCanvas.height = h;
      const baseCtx = baseCanvas.getContext("2d");

      const maskCanvas = document.createElement("canvas");
      maskCanvas.width = w;
      maskCanvas.height = h;
      const maskCtx = maskCanvas.getContext("2d");

      const texSources = [
        "https://cdn.jsdelivr.net/gh/mrdoob/three.js@r164/examples/textures/planets/earth_atmos_2048.jpg",
        "https://raw.githubusercontent.com/turban/webgl-earth/master/images/2_no_clouds_8k.jpg"
      ];

      let painted = false;
      for (const src of texSources) {
        try {
          const img = await loadImage(src);
          baseCtx.filter = "contrast(1.08) saturate(0.9)";
          baseCtx.drawImage(img, 0, 0, w, h);
          baseCtx.filter = "none";
          painted = true;
          break;
        } catch (_error) {
        }
      }

      if (!painted) {
        const gradient = baseCtx.createLinearGradient(0, 0, w, h);
        gradient.addColorStop(0, "#5a6672");
        gradient.addColorStop(0.5, "#4b5661");
        gradient.addColorStop(1, "#394249");
        baseCtx.fillStyle = gradient;
        baseCtx.fillRect(0, 0, w, h);
      }

      maskCtx.fillStyle = "rgba(0,0,0,0.72)";
      maskCtx.fillRect(0, 0, w, h);
      drawPolygon(maskCtx, AFRICA_POLY, w, h, "rgba(0,0,0,0)");
      drawPolygon(maskCtx, MADAGASCAR_POLY, w, h, "rgba(0,0,0,0.08)");

      const baseTexture = new THREE.CanvasTexture(baseCanvas);
      baseTexture.colorSpace = THREE.SRGBColorSpace;
      baseTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();

      const maskTexture = new THREE.CanvasTexture(maskCanvas);
      maskTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();

      const earth = new THREE.Mesh(
        new THREE.SphereGeometry(globeRadius, 128, 128),
        new THREE.MeshStandardMaterial({ map: baseTexture, roughness: 0.82, metalness: 0.02 })
      );

      const dimmer = new THREE.Mesh(
        new THREE.SphereGeometry(globeRadius + 0.006, 128, 128),
        new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.62, alphaMap: maskTexture, depthWrite: false })
      );

      const borderPoints = AFRICA_POLY.map(([lon, lat]) => llToVec(lat, lon, globeRadius + 0.015));
      borderPoints.push(borderPoints[0].clone());
      const border = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(borderPoints),
        new THREE.LineBasicMaterial({ color: 0x37d7ff, transparent: true, opacity: 0.58 })
      );

      return { earth, dimmer, border };
    }

    function buildRoutes() {
      const group = new THREE.Group();
      const clickable = [];

      for (const route of ROUTES) {
        const start = llToVec(route.start.lat, route.start.lon, globeRadius + 0.03);
        const end = llToVec(route.end.lat, route.end.lon, globeRadius + 0.03);
        const mid = start.clone().add(end).normalize().multiplyScalar(globeRadius + 0.38);
        const curve = new THREE.QuadraticBezierCurve3(start, mid, end);

        const line = new THREE.Line(
          new THREE.BufferGeometry().setFromPoints(curve.getPoints(110)),
          new THREE.LineBasicMaterial({ color: route.color, transparent: true, opacity: 0.9 })
        );
        line.userData.route = route;
        group.add(line);
        clickable.push(line);

        const markerGeometry = new THREE.SphereGeometry(0.024, 14, 14);
        const markerMaterial = new THREE.MeshBasicMaterial({ color: route.color });

        const markerA = new THREE.Mesh(markerGeometry, markerMaterial);
        markerA.position.copy(start);
        markerA.userData.route = route;

        const markerB = new THREE.Mesh(markerGeometry, markerMaterial);
        markerB.position.copy(end);
        markerB.userData.route = route;

        group.add(markerA, markerB);
        clickable.push(markerA, markerB);
      }

      return { group, clickable };
    }

    const raycaster = new THREE.Raycaster();
    raycaster.params.Line.threshold = 0.06;
    const mouse = new THREE.Vector2();
    let pickables = [];

    function hidePopup() {
      popup.style.display = "none";
      popup.setAttribute("aria-hidden", "true");
    }

    function showPopup(route, x, y) {
      popupTitle.textContent = route.title;
      popupDistance.textContent = `Total distance: ${route.distanceKm.toLocaleString()} km`;
      popup.style.display = "block";
      popup.setAttribute("aria-hidden", "false");

      const width = popup.offsetWidth || 300;
      const height = popup.offsetHeight || 120;
      const left = Math.min(window.innerWidth - width - 12, Math.max(12, x + 14));
      const top = Math.min(window.innerHeight - height - 12, Math.max(12, y - 16));
      popup.style.left = `${left}px`;
      popup.style.top = `${top}px`;
    }

    waitlistButton.addEventListener("click", () => {
      window.location.href = "https://example.com/waitlist-placeholder";
    });

    function toNdc(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    }

    function pickRoute(event) {
      toNdc(event);
      raycaster.setFromCamera(mouse, camera);
      const intersections = raycaster.intersectObjects(pickables, false);
      if (!intersections.length) {
        hidePopup();
        return;
      }

      const hit = intersections[0].object;
      if (!hit.userData.route) {
        hidePopup();
        return;
      }

      showPopup(hit.userData.route, event.clientX, event.clientY);
    }

    let lastDouble = 0;

    renderer.domElement.addEventListener("dblclick", (event) => {
      toNdc(event);
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObject(globeRoot, true).filter((h) => h.object.type === "Mesh");
      if (!hits.length) return;

      const point = hits[0].point.clone().normalize();
      camera.position.copy(point.clone().multiplyScalar(3.1));
      controls.target.copy(point.clone().multiplyScalar(0.65));
      controls.update();
      hidePopup();
      lastDouble = performance.now();
    });

    renderer.domElement.addEventListener("click", (event) => {
      if (performance.now() - lastDouble < 250) return;
      pickRoute(event);
    });

    renderer.domElement.addEventListener("wheel", hidePopup, { passive: true });
    renderer.domElement.addEventListener("pointerdown", (event) => {
      if (!popup.contains(event.target)) hidePopup();
    });

    function resize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      if (camera.position.length() < 8.2) {
        camera.position.z = width < 760 ? 7.6 : 6.7;
      }
    }

    window.addEventListener("resize", resize);

    async function init() {
      const { earth, dimmer, border } = await buildGlobe();
      const { group, clickable } = buildRoutes();

      globeRoot.add(earth, dimmer, border, group);

      globeRoot.rotation.z = THREE.MathUtils.degToRad(-23.4);
      globeRoot.rotation.y = THREE.MathUtils.degToRad(-18);

      pickables = clickable;
      resize();
      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    init();
  </script>
</body>
</html>
